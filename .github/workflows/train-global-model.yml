name: Train global weather model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install training dependencies
        run: pip install -r requirements.txt
      - name: Verify and extract committed training dataset
        run: |
          test -s data/global_weather_1y.csv.gz
          gzip -t data/global_weather_1y.csv.gz
          gzip -dk data/global_weather_1y.csv.gz
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("data/global_weather_1y.csv")
          locations = df["location_id"].nunique()
          countries = df["country_code"].nunique()
          print(f"Rows: {len(df):,}; locations: {locations}; countries: {countries}")
          if locations < 1200 or countries < 40:
              raise SystemExit("Committed dataset does not meet the 1,200-location / 40-country requirement.")
          PY
      - name: Train and evaluate global model
        run: python -m scripts.train_global_model
      - name: Upload trained model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: global-weather-model-${{ github.run_number }}
          path: |
            artifacts/global_weather_model.joblib
            artifacts/metrics.json
          retention-days: 90
